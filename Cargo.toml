[package]
name = "luma-swarm-studio"
version = "1.0.0"
edition = "2021"
description = "A cinematic 3D drone-show simulator and choreography studio"
authors = ["CHCOfficial"]
license-file = "LICENSE.md"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.21", features = ["derive"] }
eframe = { version = "0.31", features = ["wgpu", "persistence"] }
egui-wgpu = "0.31"
glam = { version = "0.30", features = ["serde", "bytemuck"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
rand = { version = "0.9", features = ["small_rng"] }
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
